<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<!-- Prototipe rencana 1D: lobi penuh bertema Starfield Library, dirender 3D
     dengan Three.js (butuh internet untuk CDN). Bukan kode aplikasi. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Libre+Caslon+Text:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--panel:rgba(10,28,33,.88);--line:rgba(120,210,195,.22);--ink:#e8f2f0;--muted:#8fb0ab;--teal2:#2fe0b8}
  html,body{margin:0;height:100%;background:#1b120c;color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;overflow:hidden;touch-action:none}
  canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none}
  .hs{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:700 14px 'Atkinson Hyperlegible',sans-serif;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:auto;cursor:pointer;will-change:transform}
  .hs .count{color:var(--muted);font-weight:400}
  .hs .badge{min-width:20px;height:20px;border-radius:10px;background:#e8a33b;color:#1b1206;font-size:12px;display:grid;place-items:center;padding:0 5px}
  .hs.empty{opacity:.6}
  .hs:hover,.hs:focus-visible{border-color:var(--teal2);outline:none}
  .tag{position:fixed;left:14px;top:14px;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14px;max-width:320px}
  .tag b{font:700 17px 'Libre Caslon Text',Georgia,serif}
  .tag p{margin:4px 0 0;color:var(--muted)}
  .fps{position:fixed;right:14px;top:14px;padding:6px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--teal2);font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  @media (max-width:700px){.hs{font-size:12px;padding:5px 9px}.tag{right:14px;max-width:none;font-size:13px}.fps{top:auto;bottom:14px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div class="tag"><b>Lobi Starfield — prototipe 3D</b><p>Geser dengan drag, zoom dengan roda/dua jari. Klik label untuk berpindah.</p></div>
<div class="fps" id="fps">… fps</div>
<div id="labels"></div>
<output class="toast" id="toast"></output>
<script type="module">
import * as THREE from "three"
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js"
import { OrbitControls } from "three/addons/controls/OrbitControls.js"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"

// Metres. X runs along the glass/shelf wall (Z = 0), Z along the left shelf
// wall (X = 0), Y up. The camera looks from +X +Z, like the SVG lobby.
const SIZE = 34
const HEIGHT = 13.5
// ?debugbg is a light test mode: static scene, no bloom or shadows.
const testMode = location.search.includes("debugbg")
const reduced = testMode || matchMedia("(prefers-reduced-motion: reduce)").matches

const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.shadowMap.enabled = !testMode
renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 0.82
document.body.prepend(renderer.domElement)

const scene = new THREE.Scene()
// ?debugbg paints the void magenta, to check that the view never shows it.
scene.background = new THREE.Color(location.search.includes("debugbg") ? "#ff00ff" : "#1b120c")
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = 0.18

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200)
const target = new THREE.Vector3(14, 4, 14)
camera.position.copy(target).add(new THREE.Vector3(40, 40, 40))
camera.lookAt(target)

const composer = new EffectComposer(renderer)
composer.addPass(new RenderPass(scene, camera))
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.35, 0.45, 0.9)
if (!testMode) composer.addPass(bloom)
composer.addPass(new OutputPass())

// Lights: warm atrium light, a soft key light for shadows.
scene.add(new THREE.HemisphereLight("#ffe9cc", "#4a2e18", 0.55))
const key = new THREE.DirectionalLight("#ffe6c4", 1.25)
key.position.set(22, 30, 34)
key.target.position.set(14, 0, 14)
key.castShadow = true
key.shadow.mapSize.set(2048, 2048)
Object.assign(key.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, far: 100 })
key.shadow.radius = 5
key.shadow.bias = -0.0005
scene.add(key, key.target)

// ── Helpers ───────────────────────────────────────────────────────────────
const mats = new Map()
const mat = (color, extra = {}) => {
  const k = color + JSON.stringify(extra)
  if (!mats.has(k)) mats.set(k, new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...extra }))
  return mats.get(k)
}
function mesh(geo, material, x, y, z, opts = {}) {
  const m = new THREE.Mesh(geo, typeof material === "string" ? mat(material) : material)
  m.position.set(x, y, z)
  m.castShadow = opts.cast ?? true
  m.receiveShadow = opts.receive ?? true
  ;(opts.parent ?? scene).add(m)
  return m
}
const rbox = (w, h, d, r = 0.04) => new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2.01, h / 2.01, d / 2.01))
/** Rounded box with its base at y. */
const block = (w, h, d, material, x, y, z, opts = {}) => mesh(rbox(w, h, d, opts.r), material, x, y + h / 2, z, opts)
let seed = 7
const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646
const pick = (list) => list[Math.floor(rand() * list.length)]
function canvasTexture(w, h, draw, repeat) {
  const c = document.createElement("canvas")
  c.width = w
  c.height = h
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.anisotropy = 8
  if (repeat) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping
    t.repeat.set(...repeat)
  }
  return t
}

// ── Floor: polished wood ──────────────────────────────────────────────────
const floorTex = canvasTexture(1024, 1024, (g) => {
  for (let i = 0; i < 16; i++) {
    for (let j = 0; j < 5; j++) {
      const tone = 112 + Math.floor(rand() * 22)
      g.fillStyle = `rgb(${tone + 34},${tone - 8},${tone - 52})`
      g.fillRect(j * 256 + (i % 2) * 128 - 128, i * 64, 256, 64)
      g.fillStyle = "rgba(40,20,8,.35)"
      g.fillRect(j * 256 + (i % 2) * 128 - 128, i * 64, 2, 64)
    }
    g.fillStyle = "rgba(40,20,8,.4)"
    g.fillRect(0, i * 64 + 62, 1024, 2)
  }
}, [3, 3])
// The floor runs on past the open front of the room, so the screen is always full.
floorTex.repeat.set(6, 6)
mesh(new THREE.BoxGeometry(SIZE * 2, 0.2, SIZE * 2), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.32, metalness: 0.05 }), SIZE, -0.1, SIZE, { cast: false })

// ── Shelf walls with glowing cubbies ──────────────────────────────────────
const CELL_W = 0.9
const CELL_H = 0.72
const DEPTH = 0.42
const glowTex = canvasTexture(128, 128, (g) => {
  const grad = g.createRadialGradient(64, 54, 6, 64, 64, 84)
  grad.addColorStop(0, "#ffe2a8")
  grad.addColorStop(0.5, "#e8913f")
  grad.addColorStop(1, "#3a1e0c")
  g.fillStyle = grad
  g.fillRect(0, 0, 128, 128)
})
const BOOK_COLORS = ["#f4efe6", "#e9e2d4", "#d9cdb8", "#3d5a80", "#98c1d9", "#ee6c4d", "#f4a6a0", "#7a9e7e", "#2f3e46", "#c9a35b", "#b56576", "#ffffff"]
const books = []
const dividers = []
/**
 * A wall of cubbies. `o` is the bottom-left corner on the wall surface, `u` the
 * direction along the wall, `n` the direction into the room.
 */
function shelfFace(o, u, n, width, height, opts = {}) {
  const cols = Math.round(width / CELL_W)
  const rows = Math.round(height / CELL_H)
  const cw = width / cols
  const ch = height / rows
  const up = new THREE.Vector3(0, 1, 0)
  const at = (a, b, c) => o.clone().addScaledVector(u, a).addScaledVector(up, b).addScaledVector(n, c)
  // Back panel that glows.
  const tex = glowTex.clone()
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping
  tex.repeat.set(cols, rows)
  tex.needsUpdate = true
  const back = new THREE.Mesh(new THREE.PlaneGeometry(width, height), new THREE.MeshStandardMaterial({ color: "#6b4426", emissive: "#ffffff", emissiveMap: tex, emissiveIntensity: opts.glow ?? 0.8, roughness: 0.9 }))
  back.position.copy(at(width / 2, height / 2, 0.01))
  back.lookAt(back.position.clone().add(n))
  back.receiveShadow = true
  scene.add(back)
  // Dividers (one long board per grid line).
  const rot = Math.atan2(u.x, u.z) - Math.PI / 2
  for (let c = 0; c <= cols; c++) dividers.push({ p: at(c * cw, height / 2, DEPTH / 2), s: [0.05, height, DEPTH], rot })
  for (let r = 0; r <= rows; r++) dividers.push({ p: at(width / 2, r * ch, DEPTH / 2), s: [width, 0.05, DEPTH], rot })
  // Books.
  for (let c = 0; c < cols; c++) {
    for (let r = 0; r < rows; r++) {
      if (rand() < 0.08) continue
      let a = c * cw + 0.06
      const lean = rand() < 0.2
      const end = (c + 1) * cw - (lean ? 0.25 : 0.08)
      while (a < end) {
        const bw = 0.045 + rand() * 0.05
        const bh = ch * (0.5 + rand() * 0.32)
        books.push({ p: at(a + bw / 2, r * ch + 0.025 + bh / 2, 0.06 + 0.13), s: [bw, bh, 0.26], rot, color: pick(BOOK_COLORS) })
        a += bw + 0.004
      }
    }
  }
}
const X = new THREE.Vector3(1, 0, 0)
const Z = new THREE.Vector3(0, 0, 1)
// Left wall (X = 0): cubbies the whole way.
shelfFace(new THREE.Vector3(0.0, 0, SIZE), Z.clone().negate(), X, SIZE, HEIGHT)
// Right wall (Z = 0): cubbies up to the glass curtain wall.
const GLASS = { x0: 17, x1: SIZE, y0: 0.4, y1: HEIGHT - 0.4 }
shelfFace(new THREE.Vector3(0, 0, 0), X, Z, GLASS.x0 - 0.4, HEIGHT)
// Wall shells behind the shelves and around the glass.
block(0.4, HEIGHT, SIZE, "#3a2516", -0.2, 0, SIZE / 2, { r: 0.02 })
block(GLASS.x0, HEIGHT, 0.4, "#3a2516", GLASS.x0 / 2, 0, -0.2, { r: 0.02 })

// ── Glass curtain wall with a skyline outside ─────────────────────────────
const glassMask = new THREE.Mesh(
  new THREE.PlaneGeometry(GLASS.x1 - GLASS.x0, GLASS.y1 - GLASS.y0),
  new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false, stencilWrite: true, stencilRef: 1, stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp })
)
glassMask.position.set((GLASS.x0 + GLASS.x1) / 2, (GLASS.y0 + GLASS.y1) / 2, -0.05)
glassMask.renderOrder = -1
scene.add(glassMask)
const OUTSIDE = { stencilWrite: true, stencilRef: 1, stencilFunc: THREE.EqualStencilFunc, stencilZPass: THREE.KeepStencilOp }
// Skyline painted on a backdrop just behind the glass (the camera looks down,
// so real distance would only show the street). Tower tops are remembered so
// their beacons can blink.
const SKY = { x0: GLASS.x0 - 4, x1: SIZE + 2, y0: -4, y1: HEIGHT + 1, z: -2.2 }
const beaconSpots = []
const skyTex = canvasTexture(2048, 2048, (g, w, h) => {
  const sky = g.createLinearGradient(0, 0, 0, h)
  sky.addColorStop(0, "#2b3a67")
  sky.addColorStop(0.45, "#6c5b9e")
  sky.addColorStop(0.72, "#e7909a")
  sky.addColorStop(0.88, "#ffc58a")
  g.fillStyle = sky
  g.fillRect(0, 0, w, h)
  const layer = (count, minH, maxH, base, color, lit) => {
    let x = -20
    while (x < w) {
      const bw = 60 + rand() * 120
      const bh = minH + rand() * (maxH - minH)
      const top = base - bh
      g.fillStyle = color
      g.fillRect(x, top, bw, h - top)
      if (rand() < 0.3) g.fillRect(x + bw * 0.4, top - 40, bw * 0.2, 40)
      if (lit) {
        for (let wy = top + 12; wy < h - 10; wy += 22) {
          for (let wx = x + 8; wx < x + bw - 10; wx += 16) {
            if (rand() < 0.38) {
              g.fillStyle = rand() < 0.8 ? "rgba(255,214,150,.85)" : "rgba(180,220,255,.8)"
              g.fillRect(wx, wy, 8, 11)
            }
          }
        }
      }
      if (lit && bh > maxH * 0.75) beaconSpots.push([x + bw / 2, top - (rand() < 0.3 ? 40 : 0)])
      x += bw + 6 + rand() * 30
    }
  }
  layer(0, 500, 900, h * 0.92, "#5d4f7d", false)
  layer(0, 700, 1300, h * 0.95, "#3c3557", true)
  layer(0, 400, 1000, h * 1.0, "#272338", true)
})
const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(SKY.x1 - SKY.x0, SKY.y1 - SKY.y0), new THREE.MeshBasicMaterial({ map: skyTex, ...OUTSIDE }))
backdrop.position.set((SKY.x0 + SKY.x1) / 2, (SKY.y0 + SKY.y1) / 2, SKY.z)
scene.add(backdrop)
const toWorld = ([px, py]) => new THREE.Vector3(SKY.x0 + (px / 2048) * (SKY.x1 - SKY.x0), SKY.y1 - (py / 2048) * (SKY.y1 - SKY.y0), SKY.z + 0.05)
const beacons = beaconSpots.slice(0, 7).map((spot, i) => {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), new THREE.MeshBasicMaterial({ color: "#ff3b3b", ...OUTSIDE }))
  b.position.copy(toWorld(spot))
  b.userData.phase = i * 0.37
  scene.add(b)
  return b
})
const cloudMat = new THREE.MeshStandardMaterial({ color: "#fff4f0", emissive: "#ffd9d0", emissiveIntensity: 0.55, roughness: 1, ...OUTSIDE })
const clouds = Array.from({ length: 5 }, (_, i) => {
  const g = new THREE.Group()
  for (const [dx, dy, r] of [[0, 0, 0.7], [0.8, -0.1, 0.5], [-0.8, -0.12, 0.5], [0.3, 0.38, 0.5]]) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 12), cloudMat)
    m.position.set(dx, dy, 0)
    g.add(m)
  }
  g.scale.set(1 + (i % 3) * 0.4, 0.55, 0.2)
  g.position.set(GLASS.x0 + i * 3.5, 8.5 + (i % 3) * 1.4, -1.6)
  g.userData.speed = 0.25 + (i % 3) * 0.08
  scene.add(g)
  return g
})
const birdMat = new THREE.MeshBasicMaterial({ color: "#2a2433", side: THREE.DoubleSide, ...OUTSIDE })
const birds = Array.from({ length: 4 }, (_, i) => {
  const g = new THREE.Group()
  const wing = new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0, 0.34, 0, 0, 0.17, 0.08, 0], 3))
  const l = new THREE.Mesh(wing, birdMat)
  const r = new THREE.Mesh(wing, birdMat)
  r.rotation.y = Math.PI
  g.add(l, r)
  g.position.set(SIZE - i * 0.7, 9.5 + (i % 2) * 0.4 - i * 0.2, -0.9)
  g.userData = { l, r, speed: 1.1 + i * 0.1, phase: i * 1.3 }
  scene.add(g)
  return g
})
// Mullions and a faint pane.
for (let x = GLASS.x0; x <= GLASS.x1 + 0.01; x += 2.6) block(0.14, HEIGHT, 0.22, "#d8d2c8", Math.min(x, GLASS.x1 - 0.07), 0, -0.05)
for (const y of [0, 4.5, 9, HEIGHT - 0.25]) block(GLASS.x1 - GLASS.x0, 0.22, 0.24, "#d8d2c8", (GLASS.x0 + GLASS.x1) / 2, y, -0.05)
const pane = new THREE.Mesh(new THREE.PlaneGeometry(GLASS.x1 - GLASS.x0, GLASS.y1 - GLASS.y0), new THREE.MeshBasicMaterial({ color: "#bcd6ff", transparent: true, opacity: 0.06, depthWrite: false }))
pane.position.copy(glassMask.position).setZ(0.02)
scene.add(pane)

// ── Mezzanines, floating shelf box and the grand stairs ───────────────────
const WHITE = "#ddd6cb"
const glassRail = new THREE.MeshStandardMaterial({ color: "#d7f0ff", transparent: true, opacity: 0.18, roughness: 0.1, depthWrite: false })
function balcony(x0, x1, z0, z1, y) {
  block(x1 - x0, 0.42, z1 - z0, WHITE, (x0 + x1) / 2, y - 0.42, (z0 + z1) / 2, { r: 0.1 })
  block(x1 - x0, 0.06, z1 - z0, "#b07b4a", (x0 + x1) / 2, y, (z0 + z1) / 2, { r: 0.02, cast: false })
  // Warm strip of light under the edge.
  if (z1 < SIZE) block(x1 - x0 - 0.2, 0.05, 0.05, new THREE.MeshBasicMaterial({ color: "#ffd9a0" }), (x0 + x1) / 2, y - 0.45, z1 - 0.06, { cast: false })
  if (x1 < SIZE) block(0.05, 0.05, z1 - z0 - 0.2, new THREE.MeshBasicMaterial({ color: "#ffd9a0" }), x1 - 0.06, y - 0.45, (z0 + z1) / 2, { cast: false })
  // Glass railings on the open sides.
  if (x1 < SIZE) mesh(new THREE.BoxGeometry(0.03, 1, z1 - z0), glassRail, x1 - 0.05, y + 0.5, (z0 + z1) / 2, { cast: false })
  if (z1 < SIZE) mesh(new THREE.BoxGeometry(x1 - x0, 1, 0.03), glassRail, (x0 + x1) / 2, y + 0.5, z1 - 0.05, { cast: false })
}
balcony(0, 3.2, 10, SIZE, 4.6)
balcony(0, 3.2, 10, SIZE, 9.2)
balcony(10.5, GLASS.x0 - 0.4, 0, 3.2, 4.6)
balcony(10.5, GLASS.x0 - 0.4, 0, 3.2, 9.2)
// The floating box of shelves above the stairs.
const BOX = { x0: 1.5, x1: 9.5, z0: 1.5, z1: 9.5, y0: 8.4, y1: HEIGHT - 0.6 }
block(BOX.x1 - BOX.x0, BOX.y1 - BOX.y0, BOX.z1 - BOX.z0, "#8a5a33", (BOX.x0 + BOX.x1) / 2, BOX.y0, (BOX.z0 + BOX.z1) / 2, { r: 0.05 })
block(BOX.x1 - BOX.x0 + 0.3, 0.3, BOX.z1 - BOX.z0 + 0.3, "#c9945f", (BOX.x0 + BOX.x1) / 2, BOX.y0 - 0.3, (BOX.z0 + BOX.z1) / 2, { r: 0.05 })
shelfFace(new THREE.Vector3(BOX.x1, BOX.y0, BOX.z1), Z.clone().negate(), X, BOX.z1 - BOX.z0, BOX.y1 - BOX.y0, { glow: 0.9 })
shelfFace(new THREE.Vector3(BOX.x0, BOX.y0, BOX.z1), X, Z, BOX.x1 - BOX.x0, BOX.y1 - BOX.y0, { glow: 0.9 })
// Bleacher stairs rising toward the right wall, with seats, LEDs and shelves.
const STAIRS = { x0: 1.5, x1: 9.5, z1: 10.2, steps: 10, rise: 0.46, run: 0.92 }
const led = new THREE.MeshBasicMaterial({ color: "#fff2d6" })
const seated = []
for (let k = 0; k < STAIRS.steps; k++) {
  const zFront = STAIRS.z1 - k * STAIRS.run
  const top = (k + 1) * STAIRS.rise
  block(STAIRS.x1 - STAIRS.x0, top, zFront, WHITE, (STAIRS.x0 + STAIRS.x1) / 2, 0, zFront / 2, { r: 0.03 })
  block(STAIRS.x1 - STAIRS.x0 - 0.2, 0.03, 0.03, led, (STAIRS.x0 + STAIRS.x1) / 2, top - 0.1, zFront + 0.01, { cast: false })
  if (k % 3 === 1) {
    // A small shelf set into the step.
    block(1.6, STAIRS.rise - 0.08, 0.05, "#5a3a22", 3 + (k % 2) * 3, top - STAIRS.rise + 0.02, zFront + 0.02, { r: 0.01 })
    for (let i = 0; i < 18; i++) block(0.06, 0.24 + rand() * 0.1, 0.18, pick(BOOK_COLORS), 2.3 + (k % 2) * 3 + i * 0.08, top - STAIRS.rise + 0.06, zFront - 0.06, { r: 0.005 })
  }
  if (k > 0 && k < STAIRS.steps - 1) for (let s = 0; s < 2; s++) if (rand() < 0.55) seated.push([STAIRS.x0 + 1 + rand() * 6, top, zFront - 0.45])
}
// Steps continue to the mezzanine as a white landing.
block(STAIRS.x1 - STAIRS.x0, 4.6, 0.6, WHITE, (STAIRS.x0 + STAIRS.x1) / 2, 0, 0.3, { r: 0.03 })

// ── Furniture ─────────────────────────────────────────────────────────────
const WOOD = "#c98d55"
function towerShelf(cx, cz, h = 5.4, w = 2.4) {
  block(w, h, w, "#6b4426", cx, 0, cz, { r: 0.04 })
  shelfFace(new THREE.Vector3(cx + w / 2, 0.1, cz + w / 2), Z.clone().negate(), X, w, h - 0.2, { glow: 0.9 })
  shelfFace(new THREE.Vector3(cx - w / 2, 0.1, cz + w / 2), X, Z, w, h - 0.2, { glow: 0.9 })
  block(w + 0.12, 0.14, w + 0.12, "#b9824c", cx, h, cz, { r: 0.04 })

function walker(points, speed) {
  const p = person()
  const segs = []
  let total = 0
  for (let i = 0; i < points.length; i++) {
    const a = points[i], b = points[(i + 1) % points.length]
    const len = Math.hypot(b[0] - a[0], b[1] - a[1])
    segs.push({ a, b, len, pause: a[2] ?? 0 })
    total += len / speed + (a[2] ?? 0)
  }
  return Object.assign(p, { segs, total, speed })
}

// ── Camera: fill the screen, pan and zoom ─────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement)
controls.target.copy(target)
controls.enableRotate = false
controls.screenSpacePanning = true
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN }

// The view never leaves the library. On screen the atrium is a hexagon: the
// tops of the two back walls above, the ends of the walls at the sides, and the
// front edges of the floor below. The whole screen rectangle must stay inside
// it, so zooming out stops where the atrium fills the screen, and panning stops
// at its edges. u/v are screen-right/screen-up distances in metres. The floor
// in front of the room counts as part of the map for FRONT metres, so the
// reading table and the admin desk can be scrolled well into view.
const SCREEN_RIGHT = new THREE.Vector3(1, 0, -1).normalize()
const SCREEN_UP = new THREE.Vector3(-1, 2, -1).normalize()
const EDGE = 0.25
const FRONT = 6
const FLOOR_EXT = SIZE + FRONT
const R2 = Math.SQRT2
const R3 = Math.sqrt(3)
const R6 = Math.sqrt(6)
function clampView() {
  const hw = camera.right / camera.zoom
  const hh = camera.top / camera.zoom
  const t = controls.target
  const u0 = SCREEN_RIGHT.dot(t)
  const v0 = SCREEN_UP.dot(t)
  // Sideways, the view must stay within the wall ends, and also where the
  // space between the wall tops and the floor edge is still tall enough.
  const fitV = (HEIGHT + FLOOR_EXT - 2 * EDGE) / R6
  const umax = Math.max(0, Math.min((SIZE - EDGE) / R2 - hw, R3 * (fitV - hh) - hw))
  const u = Math.min(umax, Math.max(-umax, u0))
  const slope = (Math.abs(u) + hw) / R3
  const vmax = (2 * (HEIGHT - EDGE)) / R6 - slope - hh
  const vmin = (-2 * (FLOOR_EXT - EDGE)) / R6 + slope + hh
  const v = vmin > vmax ? (vmin + vmax) / 2 : Math.min(vmax, Math.max(vmin, v0))
  if (u === u0 && v === v0) return
  const delta = SCREEN_RIGHT.clone().multiplyScalar(u - u0).addScaledVector(SCREEN_UP, v - v0)
  t.add(delta)
  camera.position.add(delta)
}
function resize() {
  const aspect = innerWidth / innerHeight
  // Zoom 1 is the widest view that still fits inside the atrium hexagon.
  const fit = Math.min((HEIGHT + FLOOR_EXT - 2 * EDGE) / R6 / (1 + aspect / R3), (SIZE - EDGE) / R2 / aspect)
  const halfH = fit * 0.96
  const halfW = halfH * aspect
  Object.assign(camera, { left: -halfW, right: halfW, top: halfH, bottom: -halfH })
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
  composer.setSize(innerWidth, innerHeight)
  bloom.resolution.set(innerWidth / 2, innerHeight / 2)
  if (aspect < 1) {
    // Phones open at the reading table.
    controls.target.set(17, 3, 19)
    camera.position.copy(controls.target).add(new THREE.Vector3(40, 40, 40))
    camera.zoom = 1.6
    camera.updateProjectionMatrix()
    controls.update()
  }
  clampView()
  placeLabels()
}
addEventListener("resize", () => {
  resize()
  requestRender()
})

// ── Animation ─────────────────────────────────────────────────────────────
function animate(t, dt) {
  for (const w of walkers) {
    let time = t % w.total
    for (const s of w.segs) {
      const walkT = s.len / w.speed
      if (time > s.pause + walkT) {
        time -= s.pause + walkT
        continue
      }
      const moving = time > s.pause
      const f = moving ? (time - s.pause) / walkT : 0
      w.root.position.set(s.a[0] + (s.b[0] - s.a[0]) * f, 0, s.a[1] + (s.b[1] - s.a[1]) * f)
      w.root.rotation.y = Math.atan2(s.b[0] - s.a[0], s.b[1] - s.a[1])
      const swing = moving ? Math.sin(t * 6.5) * 0.42 : 0
      w.legs[0].hip.rotation.x = swing
      w.legs[1].hip.rotation.x = -swing
      w.legs[0].knee.rotation.x = Math.max(0, -swing) * 0.8
      w.legs[1].knee.rotation.x = Math.max(0, swing) * 0.8
      w.arms[0].rotation.x = -swing * 0.7
      w.arms[1].rotation.x = swing * 0.7
      w.head.rotation.y = moving ? 0 : Math.sin(t * 0.8) * 0.5
      break
    }
  }
  for (const s of sitters) {
    s.head.rotation.x = Math.sin(t * 0.6 + s.phase) * 0.12 + 0.15
    s.head.rotation.y = Math.sin(t * 0.3 + s.phase) * 0.25
  }
  const k = (t % 7) / 7
  for (const [i, p] of pagePivots.entries()) {
    const kk = (k + i * 0.45) % 1
    p.rotation.z = kk < 0.6 ? 0 : kk < 0.8 ? ((kk - 0.6) / 0.2) * Math.PI : Math.PI
    p.visible = kk < 0.82
  }
  librarian.arms[0].rotation.x = -1.2 + Math.sin(t * 14) * 0.06
  librarian.arms[1].rotation.x = -1.2 + Math.cos(t * 14) * 0.06
  for (const [i, a] of arts.entries()) a.rotation.y = t * (0.08 + i * 0.03)
  for (const c of clouds) {
    c.position.x += dt * c.userData.speed
    if (c.position.x > SIZE + 2) c.position.x = GLASS.x0 - 3
  }
  for (const b of birds) {
    b.position.x -= dt * b.userData.speed
    if (b.position.x < GLASS.x0 - 2) b.position.x = SIZE + 1
    const flap = Math.sin(t * 9 + b.userData.phase) * 0.8
    b.userData.l.rotation.x = flap
    b.userData.r.rotation.x = -flap
  }
  for (const b of beacons) b.visible = (t * 0.8 + b.userData.phase) % 1 < 0.45
  // "Anda" walks to the chosen spot.
  if (andaT < 1) {
    andaT = Math.min(1, andaT + dt / 0.9)
    const e = 1 - Math.pow(1 - andaT, 3)
    anda.root.position.lerpVectors(andaFrom, andaTo, e)
    anda.root.rotation.y = Math.atan2(andaTo.x - andaFrom.x, andaTo.z - andaFrom.z)
    const swing = andaT < 1 ? Math.sin(t * 9) * 0.45 : 0
    anda.legs[0].hip.rotation.x = swing
    anda.legs[1].hip.rotation.x = -swing
  }
  ring.material.opacity = 0.55 + Math.sin(t * 2.6) * 0.35
}

const fpsEl = document.getElementById("fps")
let frames = 0
let lastFps = performance.now()
let last = performance.now()
let needsRender = true
function requestRender() {
  needsRender = true
}
function loop(now) {
  requestAnimationFrame(loop)
  if (document.hidden) return
  const dt = Math.min(0.05, (now - last) / 1000)
  last = now
  if (!reduced) {
    animate(now / 1000, dt)
    controls.update()
    needsRender = true
  } else if (controls.update()) needsRender = true
  if (!needsRender) return
  composer.render()
  needsRender = false
  frames++
  if (now - lastFps > 1000) {
    fpsEl.textContent = reduced ? "gerak dikurangi: statis" : `${frames} fps`
    frames = 0
    lastFps = now
  }
}
if (reduced) animate(0, 0)
requestAnimationFrame(loop)
</script>
</body></html>
